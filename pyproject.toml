[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "add-reviewers"
dynamic = ["version"]
description = "CLI that automatically adds pull request reviewers based on past approvals."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Darbin Reyes", email = "darbin.reyes@intel.com" },
]

dependencies = [
    "click",
    "yaspin",
    "colorama",
    "emoji",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.5",
    "pytest-datadir>=1.6.1",
    "pytest-datafiles>=3.0.0"
]
lint = [
    "flake8>=7.0.0",
    "pylint>=3.0.0",
    "ruff>=0.1.0"
]
type-check = [
    "mypy>=1.8.0"
]
format = [
    "pyink>=23.12.0"
]
build = [
    "pyinstaller>=6.0.0",
    "hatch>=1.0.0",
    "keyring>=25.6.0"
]


[project.scripts]
add-reviewers = "add_reviewers.cli:main"

[tool.hatch.version]
path = "src/add_reviewers/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/add_reviewers"]
